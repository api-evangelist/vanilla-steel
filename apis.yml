aid: vanilla-steel
name: Vanilla Steel
description: Vanilla Steel is a Berlin-based B2B steel trading platform (Vanilla
  Steel GmbH, backed by seedcamp) that matches European steel buyers and sellers,
  arranges financing, and manages logistics end-to-end, connecting 500+ European
  suppliers with 5,000+ buyers and sellers and returning a best offer within 48 hours
  from a single format-agnostic request. Its SaaS products — the RFQ Classifier Outlook
  add-in, the RFQ Extractor OAuth mailbox-ingestion service for Microsoft 365 and
  Gmail, and the Quoting App — use AI to turn inbound Requests for Quotation into
  structured trading workflows. Vanilla Steel publishes no public developer API.
